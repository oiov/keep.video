services:
  website:
    image: ghcr.io/oiov/download:latest
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:6080:6080"
    volumes:
      - keep-data:/data
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  keep-data:
