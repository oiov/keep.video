name: Keep Video 镜像
on:
  push:
    branches: [main, 'feat/webui-integration']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm lint:website
      - run: pnpm test:web
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: 构建本地验收镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: keep-video:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 启动并验证单站点
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f keep-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name keep-smoke -p 127.0.0.1:6080:6080 -e SITE_URL=http://127.0.0.1:6080 keep-video:smoke
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:6080/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:6080/ | grep canonical >/dev/null
          curl -fsS http://127.0.0.1:6080/zh/ | grep hreflang >/dev/null
          curl -fsS http://127.0.0.1:6080/app/ | grep 'id="app"' >/dev/null
          curl -fsS http://127.0.0.1:6080/zh/app/ | grep 'id="app"' >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:6080/zh-cn/app/)" = 308
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:6080/missing)" = 404
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: 发布多架构镜像
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
      - name: 检查远端镜像清单
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        shell: bash
        run: |
          while IFS= read -r tag; do docker buildx imagetools inspect "$tag"; done <<< "$TAGS"
