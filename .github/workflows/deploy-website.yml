name: Deploy Framekeep Website
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['website/**', 'scripts/build-website.mjs', 'scripts/lint-website.mjs', 'wrangler.jsonc', '.github/workflows/deploy-website.yml']
permissions:
  contents: read
concurrency:
  group: framekeep-website-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: 验证官网
        run: node scripts/lint-website.mjs
      - name: 构建官网
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: node scripts/build-website.mjs
      - name: 部署 Workers 静态资源
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.85.0 deploy --config wrangler.jsonc
